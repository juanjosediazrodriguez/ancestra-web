<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-labelledby="t">
  <title id="t">Ilustración: una mochila tejida con patrones geométricos bajo un sol</title>
  <defs>
    <!-- Bandas de la mochila -->
    <pattern id="zz" width="60" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 30 L15 10 L30 30 L45 10 L60 30" fill="none" stroke="#2e2117" stroke-width="7" stroke-linejoin="round"/>
    </pattern>
    <pattern id="rombos" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M28 6 L50 28 L28 50 L6 28 Z" fill="none" stroke="#a3482a" stroke-width="6"/>
      <path d="M28 20 L36 28 L28 36 L20 28 Z" fill="#2e2117"/>
    </pattern>
    <pattern id="escalones" width="48" height="36" patternUnits="userSpaceOnUse">
      <path d="M0 30 H12 V18 H24 V6 H36 V18 H48" fill="none" stroke="#4f5a2e" stroke-width="6"/>
    </pattern>
    <pattern id="puntos" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#8c3b21"/>
    </pattern>
    <clipPath id="cuerpo">
      <path d="M215 420 Q215 395 240 395 H560 Q585 395 585 420 L600 760 Q602 800 560 805 Q400 822 240 805 Q198 800 200 760 Z"/>
    </clipPath>
    <radialGradient id="luz" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#f5ede0"/>
      <stop offset="1" stop-color="#e8dcc6"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="900" fill="url(#luz)"/>
  <circle cx="400" cy="470" r="330" fill="#e8dcc6"/>

  <!-- Sol del logo -->
  <g transform="translate(400 250)">
    <g stroke="#a3482a" stroke-width="7" stroke-linecap="round">
      <path d="M0 -150 V-115 M0 115 V150 M-150 0 H-115 M115 0 H150 M-106 -106 L-81 -81 M81 81 L106 106 M-106 106 L-81 81 M81 -81 L106 -106"/>
      <path d="M-57 -139 L-44 -106 M44 106 L57 139 M-139 57 L-106 44 M106 -44 L139 -57 M57 -139 L44 -106 M-44 106 L-57 139 M-139 -57 L-106 -44 M106 44 L139 57" stroke-width="5" opacity=".7"/>
    </g>
    <circle r="92" fill="#a3482a"/>
    <circle r="60" fill="#8c3b21"/>
    <circle r="28" fill="#2e2117"/>
  </g>

  <!-- Correa -->
  <path d="M250 410 C250 150 550 150 550 410" fill="none" stroke="#2e2117" stroke-width="34" stroke-linecap="round"/>
  <path d="M250 410 C250 150 550 150 550 410" fill="none" stroke="#e8dcc6" stroke-width="10" stroke-dasharray="4 14" stroke-linecap="round"/>

  <!-- Sombra -->
  <ellipse cx="400" cy="815" rx="230" ry="22" fill="#2e2117" opacity=".18"/>

  <!-- Cuerpo de la mochila con bandas tejidas -->
  <g clip-path="url(#cuerpo)">
    <rect x="190" y="390" width="420" height="430" fill="#f5ede0"/>
    <rect x="190" y="430" width="420" height="44" fill="url(#zz)"/>
    <rect x="190" y="486" width="420" height="10" fill="#a3482a"/>
    <rect x="190" y="508" width="420" height="112" fill="url(#rombos)"/>
    <rect x="190" y="632" width="420" height="10" fill="#4f5a2e"/>
    <rect x="190" y="654" width="420" height="40" fill="url(#escalones)"/>
    <rect x="190" y="706" width="420" height="22" fill="url(#puntos)"/>
    <rect x="190" y="740" width="420" height="44" fill="url(#zz)"/>
    <!-- Volumen: sombra a los lados -->
    <rect x="190" y="390" width="70" height="430" fill="#2e2117" opacity=".08"/>
    <rect x="540" y="390" width="70" height="430" fill="#2e2117" opacity=".12"/>
  </g>
  <!-- Borde superior -->
  <rect x="210" y="390" width="380" height="34" rx="17" fill="#2e2117"/>
  <path d="M230 407 H570" stroke="#e8dcc6" stroke-width="4" stroke-dasharray="8 10"/>

  <!-- Borlas -->
  <g fill="#a3482a">
    <path d="M232 420 v120" stroke="#2e2117" stroke-width="4"/>
    <path d="M220 540 h24 l6 70 h-36 Z"/>
    <path d="M568 420 v120" stroke="#2e2117" stroke-width="4"/>
    <path d="M556 540 h24 l6 70 h-36 Z"/>
  </g>
</svg>
